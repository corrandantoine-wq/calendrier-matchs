<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte Clients a déménagé</title>
  <meta http-equiv="refresh" content="0; url=https://corrandantoine-wq.github.io/carte-clients/">
  <link rel="canonical" href="https://corrandantoine-wq.github.io/carte-clients/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f3f5f8; color: #111827; padding: 16px; }
    .card { background: #fff; border-radius: 20px; padding: 28px 24px; max-width: 420px; text-align: center; box-shadow: 0 6px 20px rgba(16,24,40,.12); }
    a { display: inline-block; margin-top: 16px; background: #2563eb; color: #fff; padding: 12px 22px; border-radius: 24px; text-decoration: none; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #0e1116; color: #f1f3f7; } .card { background: #171b22; } }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="font-size:20px;margin:0 0 8px">📍 Carte Clients a déménagé</h1>
    <p style="margin:0">L’appli est maintenant à une nouvelle adresse. Pensez à mettre à jour votre favori ou à la réinstaller sur l’écran d’accueil.</p>
    <a href="https://corrandantoine-wq.github.io/carte-clients/">Ouvrir Carte Clients</a>
  </div>
  <script>
    // Retire l'ancienne version hors ligne de l'appli, puis redirige.
    (async () => {
      try {
        for (const r of await navigator.serviceWorker?.getRegistrations?.() || []) await r.unregister();
        for (const k of await caches?.keys?.() || []) if (k.startsWith('carte-clients')) await caches.delete(k);
      } catch {}
      location.replace('https://corrandantoine-wq.github.io/carte-clients/' + location.search + location.hash);
    })();
  </script>
</body>
</html>
